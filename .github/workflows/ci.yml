name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:faultline
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser
        run: |
          npm run preview > /tmp/faultline-preview.log 2>&1 &
          node scripts/ci-browser.mjs
